<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">会话整理示例：从信息不足的会话标题，整理成日期、类型、主题</title>
  <desc id="desc">说明性示例。原名称是一句看不出重点的请求，整理后变成 1112 | 优化 | 会话整理 Skill 宿主兼容，并列出使用的三类证据：创建时间、用户目标、最终交付。</desc>

  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2A35"/>
      <stop offset="1" stop-color="#11171F"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D7E1E8" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="560" rx="28" fill="#0B0F14"/>
  <rect width="1200" height="560" rx="28" fill="url(#grid)"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="60" y="66" fill="#9DE7D2" font-size="15" font-weight="700" letter-spacing="2.4">ILLUSTRATIVE EXAMPLE / 说明性示例</text>
    <text x="60" y="122" fill="#F4F7F9" font-size="36" font-weight="750">一次整理，改的是什么</text>
    <text x="60" y="156" fill="#9AAAB6" font-size="19">同一段对话，标题从“看不出重点”变成“一眼能认出来”。</text>

    <g transform="translate(60 190)">
      <rect width="1080" height="118" rx="14" fill="#0B0F14" fill-opacity="0.55" stroke="#F5B96A" stroke-opacity="0.38"/>
      <circle cx="28" cy="31" r="4.5" fill="#F5B96A"/>
      <text x="46" y="37" fill="#F5B96A" font-size="16" font-weight="700" letter-spacing="1.4">原名称 · 信息不足</text>
      <text x="28" y="82" fill="#C7D3DB" font-size="24">看一下这个 skill 的兼容性，然后帮我改一下标题</text>
      <text x="28" y="108" fill="#8FA1AC" font-size="18">看不出对象、动作和交付物</text>
    </g>

    <g transform="translate(600 316)">
      <path d="M0 -8V10" stroke="#9DE7D2" stroke-width="2" stroke-opacity="0.7"/>
      <path d="M-7 3L0 12L7 3" fill="none" stroke="#9DE7D2" stroke-width="2" stroke-opacity="0.7"/>
    </g>

    <g transform="translate(60 340)">
      <rect width="1080" height="118" rx="14" fill="url(#panel)" stroke="#9DE7D2" stroke-opacity="0.42"/>
      <circle cx="28" cy="31" r="4.5" fill="#9DE7D2"/>
      <text x="46" y="37" fill="#9DE7D2" font-size="16" font-weight="700" letter-spacing="1.4">新名称 · 可直接检索</text>
      <text x="28" y="84" fill="#F4F7F9" font-size="30" font-weight="700" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1112 | 优化 | 会话整理 Skill 宿主兼容</text>
      <text x="1052" y="104" text-anchor="end" fill="#8FA1AC" font-size="18">整条 ≤48 字符</text>
    </g>

    <text x="60" y="490" fill="#7C8B96" font-size="15" font-weight="700" letter-spacing="1.6">EVIDENCE USED</text>

    <g transform="translate(60 504)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
      <rect width="255" height="34" rx="8" fill="#0B0F14" fill-opacity="0.6" stroke="#D7E1E8" stroke-opacity="0.18"/>
      <text x="16" y="23" fill="#8FA1AC" font-size="15">createdAt → 1112</text>

      <g transform="translate(275 0)">
        <rect width="255" height="34" rx="8" fill="#0B0F14" fill-opacity="0.6" stroke="#D7E1E8" stroke-opacity="0.18"/>
        <text x="16" y="23" fill="#8FA1AC" font-size="15">用户目标 → 优化</text>
      </g>

      <g transform="translate(550 0)">
        <rect width="255" height="34" rx="8" fill="#0B0F14" fill-opacity="0.6" stroke="#D7E1E8" stroke-opacity="0.18"/>
        <text x="16" y="23" fill="#8FA1AC" font-size="15">最终交付 → 主题</text>
      </g>

      <g transform="translate(825 0)">
        <rect width="255" height="34" rx="8" fill="#0B0F14" fill-opacity="0.6" stroke="#D7E1E8" stroke-opacity="0.18"/>
        <text x="16" y="23" fill="#8FA1AC" font-size="15">用户确认 → 写回</text>
      </g>
    </g>
  </g>
</svg>
