<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">会话整理：让 Codex 左侧标题回到真实上下文</title>
  <desc id="desc">一个以证据为先的 Codex 任务标题整理流程，从创建时间、用户目标和最终交付生成候选标题。</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#2457D6" stroke-opacity="0.08"/></pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FBFD"/><stop offset="1" stop-color="#EDF2F7"/></linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#EAF0F6"/><rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect x="32" y="28" width="1136" height="304" rx="22" fill="url(#paper)" stroke="#17212B" stroke-opacity="0.18"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="72" y="78" fill="#2457D6" font-size="15" font-weight="750" letter-spacing="2.4">CODEX SKILL / TITLE INDEX</text>
    <text x="72" y="151" fill="#17212B" font-size="58" font-weight="780">会话整理</text>
    <text x="74" y="193" fill="#4F6070" font-size="23">让左侧标题回到真实上下文</text>
    <text x="74" y="244" fill="#687783" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EVIDENCE FIRST  ·  PRECISE TITLES</text>
    <rect x="72" y="273" width="178" height="30" rx="4" fill="#E8F0FF" stroke="#2457D6" stroke-opacity="0.5"/>
    <text x="93" y="294" fill="#2457D6" font-size="13" font-weight="700">MMDD | 类型 | 主题</text>
  </g>
  <g transform="translate(620 62)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <rect x="0" y="0" width="492" height="232" fill="#FFFDF9" stroke="#17212B" stroke-opacity="0.2"/>
    <text x="28" y="34" fill="#5E6C78" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EVIDENCE LEDGER</text>
    <line x1="28" y1="52" x2="464" y2="52" stroke="#17212B" stroke-opacity="0.14"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <circle cx="39" cy="82" r="5" fill="#C47662"/><text x="58" y="87" fill="#5E6C78">createdAt</text><text x="224" y="87" fill="#17212B">→ 0905</text><text x="333" y="87" fill="#7C8994">Asia/Shanghai</text>
      <circle cx="39" cy="124" r="5" fill="#2457D6"/><text x="58" y="129" fill="#5E6C78">用户目标</text><text x="224" y="129" fill="#17212B">→ 类型</text><text x="333" y="129" fill="#7C8994">主要交付</text>
      <circle cx="39" cy="166" r="5" fill="#2457D6"/><text x="58" y="171" fill="#5E6C78">最终交付</text><text x="224" y="171" fill="#17212B">→ 主题</text><text x="333" y="171" fill="#7C8994">对象 + 结果</text>
      <circle cx="39" cy="208" r="5" fill="#C47662"/><text x="58" y="213" fill="#5E6C78">写回标题</text><text x="224" y="213" fill="#17212B">→ set_thread_title</text>
    </g>
  </g>
</svg>
