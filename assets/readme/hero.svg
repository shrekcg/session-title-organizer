<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">会话整理：让 Codex 左侧标题回到真实上下文</title>
  <desc id="desc">一个以证据为先的 Codex 任务标题整理流程，从创建时间、用户目标和最终交付生成候选标题，确认后才写回。</desc>

  <defs>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2A35"/>
      <stop offset="1" stop-color="#11171F"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D7E1E8" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#0B0F14"/>
  <rect width="1200" height="360" rx="28" fill="url(#grid)"/>
  <rect x="32" y="28" width="1136" height="304" rx="22" fill="url(#glow)" stroke="#D7E1E8" stroke-opacity="0.16"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <text x="72" y="78" fill="#9DE7D2" font-size="15" font-weight="700" letter-spacing="2.4">CODEX SKILL / SESSION TITLE WORKFLOW</text>
    <text x="72" y="151" fill="#F4F7F9" font-size="58" font-weight="750">会话整理</text>
    <text x="74" y="193" fill="#D7E1E8" font-size="23">让左侧标题回到真实上下文</text>
    <text x="74" y="244" fill="#9AAAB6" font-size="15" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EVIDENCE FIRST  ·  REVIEW BEFORE WRITE</text>
    <rect x="72" y="273" width="178" height="30" rx="15" fill="#9DE7D2" fill-opacity="0.14" stroke="#9DE7D2" stroke-opacity="0.5"/>
    <text x="93" y="294" fill="#BDF3E2" font-size="13" font-weight="650">MMDD | 类型 | 主题</text>
  </g>

  <g transform="translate(620 62)">
    <rect x="0" y="0" width="492" height="232" rx="18" fill="#0B0F14" fill-opacity="0.62" stroke="#D7E1E8" stroke-opacity="0.16"/>
    <text x="28" y="34" fill="#9AAAB6" font-size="13" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EVIDENCE LEDGER</text>
    <line x1="28" y1="52" x2="464" y2="52" stroke="#D7E1E8" stroke-opacity="0.14"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <circle cx="39" cy="82" r="5" fill="#F5B96A"/>
      <text x="58" y="87" fill="#B7C6CF">createdAt</text>
      <text x="224" y="87" fill="#F4F7F9">→ 0905</text>
      <text x="333" y="87" fill="#9AAAB6">Asia/Shanghai</text>

      <circle cx="39" cy="124" r="5" fill="#9DE7D2"/>
      <text x="58" y="129" fill="#B7C6CF">用户目标</text>
      <text x="224" y="129" fill="#F4F7F9">→ 类型</text>
      <text x="333" y="129" fill="#9AAAB6">主要交付</text>

      <circle cx="39" cy="166" r="5" fill="#9DE7D2"/>
      <text x="58" y="171" fill="#B7C6CF">最终交付</text>
      <text x="224" y="171" fill="#F4F7F9">→ 主题</text>
      <text x="333" y="171" fill="#9AAAB6">对象 + 结果</text>

      <circle cx="39" cy="208" r="5" fill="#F5B96A"/>
      <text x="58" y="213" fill="#B7C6CF">用户确认</text>
      <text x="224" y="213" fill="#F4F7F9">→ set_thread_title</text>
    </g>
  </g>
</svg>
